name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            build_command: build
          - name: school
            build_command: build:staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.build_command }}
        env:
          CI: false

      # 机房的公网 8822 已关：school 经服务器跳板（ProxyJump）连服务器本机的 8822
      - name: 部署
        env:
          KEY: ${{ secrets.KEY }}
          HOST: ${{ secrets.HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host debian
            HostName $HOST
          Host school
            HostName 127.0.0.1
            Port 8822
            HostKeyAlias school
            ProxyJump debian
          Host *
            User root
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
          EOF
          rsync -az --delete --no-owner --no-group .vitepress/dist/ ${{ matrix.name }}:/root/Book/build/
